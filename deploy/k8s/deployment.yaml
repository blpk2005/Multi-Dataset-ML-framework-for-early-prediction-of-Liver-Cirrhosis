apiVersion: apps/v1
kind: Deployment
metadata:
  name: cirrhosis-ml-api
  labels:
    app: cirrhosis-ml-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cirrhosis-ml-api
  template:
    metadata:
      labels:
        app: cirrhosis-ml-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/username/multi-dataset-ml-framework-for-early-prediction-of-liver-cirrhosis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: cirrhosis-ml-api-service
  labels:
    app: cirrhosis-ml-api
spec:
  type: ClusterIP
  selector:
    app: cirrhosis-ml-api
  ports:
    - name: http
      port: 80
      targetPort: 8000

