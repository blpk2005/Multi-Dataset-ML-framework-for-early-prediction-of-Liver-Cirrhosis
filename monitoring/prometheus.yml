global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "liver-cirrhosis-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "cirrhosis-prediction-service"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

